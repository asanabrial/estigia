[package]
name = "estigia"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Guardrails for AI coding agents (Claude Code, Codex, OpenCode, Pi): an MCP server and hooks that verify issue claims, bind reviews to exact commits and gate merges"
repository = "https://github.com/asanabrial/estigia"
homepage = "https://github.com/asanabrial/estigia"
readme = "README.md"
keywords = ["mcp", "ai-agents", "claude-code", "guardrails", "code-review"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.97"
# An allowlist rather than `exclude`: cargo consults `.gitignore` only inside a git
# checkout, and a published crate has no use for the docs, tests, scripts and
# workflows beside the code.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**",
    "/skill/**",
    "/refusal-baseline.txt",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6.0.0"
ratatui = "0.30"
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order` keeps a user's keys in the order they wrote them. Without it
# serde_json backs objects with a BTreeMap and every edit silently re-sorts
# somebody else's settings file — `"type","command"` comes back as
# `"command","type"`, which is a diff nobody asked for in a file Estigia was
# only supposed to add one entry to.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
semver = { version = "1.0.27", features = ["serde"] }
sha2 = "0.11.0"
thiserror = "2.0.17"
# Format-preserving TOML: `setup` reads and edits `~/.codex/config.toml`, and a
# round trip through a plain `toml` value tree would reorder keys and drop the
# operator's comments. See `src/setup/codex_trust.rs`.
toml_edit = "0.25.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1.13.1"
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Parsing the crate's own source, so a `Population` declaration is read as the
# item it is and bound to the item its `subject` names. A dev-dependency: it
# never ships in the binary.
# Token streams, not `Debug`. `syn`'s `Debug` prints spans, so a fingerprint
# taken from it moves when a comment above the code is deleted — which made the
# guard reopen a claim for a reason its own documentation said it would not.
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits", "parsing", "printing"] }
tempfile = "3.23.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
# The three that catch the defects this project is most exposed to: silent
# panics in a tool people run unattended, and clones in code that walks a
# settings table on every invocation.
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
needless_collect = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
