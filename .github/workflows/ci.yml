# Every guard in this repository runs here, or it is documentation.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review]
  # The publication lane. `publish_review` and `republish_review` start this
  # workflow against the head they just pushed, so the cheapest disqualifying
  # signal — a platform this desk cannot run — arrives *before* the review
  # rounds rather than after them. Measured once: sixteen reviewers over
  # eight rounds were discarded for a one-line fixture defect that only POSIX
  # could see, because `release_ci` is what marks the PR ready and ready is
  # where CI first answered.
  #
  # One run per publication epoch, and that is the whole difference from the
  # cardinality the draft barrier refused: this is not a trigger on every topic
  # push, and dispatching does not mark the pull request ready.
  workflow_dispatch:
  # Merge queue. Fires after the review barrier, when a ready pull request
  # enters the queue — not on topic push, and not before release_ci. Named in
  # tests/release.rs so tidying cannot drop it silently.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # No toolchain action. `rust-toolchain.toml` at the repository root pins the
      # channel and its `rustfmt`/`clippy` components, and rustup resolves it for
      # every `cargo` below — so CI and a fresh clone run the same toolchain by
      # construction, which is what `CLAUDE.md`'s gate list now says.

      # One test executes the OpenCode plugin this crate generates, which is
      # JavaScript. Every hosted runner ships Node today, so leaving this out
      # would pass — until the day an image drops it, or the job moves to a
      # container that never had it. A step that needs a tool the job never sets
      # up is the failure `no_workflow_needs_only_interpreters_it_sets_up`
      # exists to refuse, and this is the second tool it has had to name.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A failing run saves its cache too. Without this the action's default
      # discards everything a red run compiled, so the fix pushed after it starts
      # from cold on all three platforms, exactly when somebody is iterating on a
      # red build. Read from this repository's run history: closing one set of
      # platform-shaped test failures took at least nine consecutive red runs of
      # this workflow on main, 31753883982 through 31760121174, each recompiling
      # the dependency tree from scratch. At least, because the run the issue
      # names as the first of them no longer exists to be counted. What a cold
      # build costs here in minutes has not been measured.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No `--locked`: rustfmt resolves no dependencies and takes no such flag.
      - name: formatting
        run: cargo fmt --all --check

      - name: lints
        run: cargo clippy --all-targets --all-features --locked

      # `--no-fail-fast` because `cargo test` stops at the first target that
      # fails and skips every later one. Measured with a failing lib test: the
      # bare command prints **one** `test result` line and this one prints nine.
      # The lib is the first target, so a failure there hides all eight others —
      # an earlier version of this comment said three, which is what a failing
      # *integration* target gives, and it was written without being run.
      # That is why `tests/pipe.rs` — the end-to-end evidence for the review
      # protocol — never ran on the Linux and macOS lanes the one time they went
      # red. It does not soften a red run; the job still fails.
      #
      # Windows is skipped until issue #11: 55 tests failed the first time they
      # ran there (run 38317428664). The lane still compiles and lints.
      - name: tests
        if: matrix.os != 'windows-latest'
        run: cargo test --all-features --no-fail-fast --locked

      - name: documentation
        run: cargo doc --no-deps --all-features --locked

      - name: release build
        run: cargo build --release --locked

      - name: the binary answers and refuses
        shell: bash
        run: |
          set -eu
          binary=target/release/estigia
          [ "${{ matrix.os }}" = "windows-latest" ] && binary=target/release/estigia.exe
          "$binary" --version
          if "$binary" setup 2>/dev/null; then
            echo "setup with no agent should have refused" >&2
            exit 1
          fi
          # Captured, then searched. This step runs under `-o pipefail`, and the
          # command under test exits non-zero *because refusing is its job* — so
          # `setup | grep` failed the whole step even when grep found the phrase.
          # The pipeline was reporting the refusal it exists to require.
          #
          # It went unseen because no run ever reached this step: `tests` failed
          # first on every one of them, on all three platforms.
          refusal=$("$binary" setup 2>&1 || true)
          printf '%s\n' "$refusal" | grep -q "estigia setup --all"
