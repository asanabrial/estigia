name: publish-registries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to publish, for example v0.1.0.
        type: string
        required: false

permissions: {}

jobs:
  crates-io:
    if: startsWith(inputs.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: The tag and the crate name one version
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          declared="$(cargo pkgid | sed 's/.*[#@]//')"
          if [ "${REF#v}" != "$declared" ]; then
            echo "tag ${REF} but Cargo.toml says ${declared}" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish unless crates.io already has it
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if curl -fsS -H 'user-agent: estigia-release' \
               "https://crates.io/api/v1/crates/estigia/${REF#v}" >/dev/null 2>&1; then
            echo "crates.io already has estigia ${REF#v}"
            exit 0
          fi
          cargo publish --locked

  npm:
    if: startsWith(inputs.ref, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish unless npm already has it
        working-directory: npm
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${REF#v}" != "$version" ]; then
            echo "tag ${REF} but npm/package.json says ${version}" >&2
            exit 1
          fi
          if npm view "@asanabrial/estigia@$version" version >/dev/null 2>&1; then
            echo "npm already has @asanabrial/estigia $version"
            exit 0
          fi
          npm publish --access public

  mcp-registry:
    if: startsWith(inputs.ref, 'v')
    needs: [crates-io, npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish unless the registry already has it
        run: |
          set -euo pipefail
          version="$(jq -r .version server.json)"
          held="$(curl -fsS 'https://registry.modelcontextprotocol.io/v0/servers?search=io.github.asanabrial/estigia' \
            | jq -r '[.servers[]?.server.version] | join(" ")')"
          for one in $held; do
            if [ "$one" = "$version" ]; then
              echo "the registry already has $version"
              exit 0
            fi
          done
          ./mcp-publisher publish
